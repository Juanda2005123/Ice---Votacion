# ========================================
# CONFIGURACIÓN DEL LUGAR DE VOTACIÓN
# ========================================

# Identificación del lugar de votación
lugar.id=LUGAR-001
lugar.nombre=Lugar de Votacion Central

# Configuración del servidor Ice (para RECIBIR votos del broker mesa-lugar)
lugar.puerto=8001
lugar.host=localhost
lugar.timeout=5000

# Configuración del broker destino (para ENVIAR votos al broker lugar-departamento)
broker.destino.host=localhost
broker.destino.puerto=9001
broker.destino.timeout=5000


# Configuración de logging
logging.nivel=INFO
logging.archivo=lugar-votacion.log