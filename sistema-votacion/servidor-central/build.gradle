// Este build.gradle es específico para el módulo servidor-central
// Solo define configuraciones particulares de este módulo

jar {
    manifest {        
        attributes(
            "Main-Class": "ServidorCentralApp"
        )
    }
}

// Plugin de aplicación para poder ejecutar con 'gradle run'
apply plugin: 'application'
mainClassName = 'ServidorCentralApp'