//
// Install the gradle Ice Builder plug-in from the plug-in portal
//
plugins {
    id 'com.zeroc.gradle.ice-builder.slice' version '1.4.7' apply false
}
  
subprojects {
    //
    // Apply Java and Ice Builder plug-ins to all sub-projects
    //
    apply plugin: 'java'
    apply plugin: 'eclipse'  // ← Genera archivos .project y .classpath
    apply plugin: 'com.zeroc.gradle.ice-builder.slice'
 
    //
    // Both Client and Server projects share the Printer.ice Slice definitions
    //
    
    slice {
        java {
            files = [file("../common/src/main/slice/VotingService.ice")]  
        }
    }
    
        // Use Ice JAR files from maven central repository
    repositories {
        mavenCentral()
    }
      //
    // Both Client and Server depend only on Ice JAR
    //
    dependencies {
        implementation 'com.zeroc:ice:3.7.10'
        implementation 'com.zeroc:icestorm:3.7.10'
        implementation 'com.google.code.gson:gson:2.10.1'
        implementation 'org.postgresql:postgresql:42.6.0'
    }
}

// Configure project-specific dependencies OUTSIDE of subprojects block
project(':mesa-votacion') {
    dependencies {
        implementation project(':common')
    }
}

project(':servidor-central') {
    dependencies {
        implementation project(':common')
    }
}

project(':departamento') {
    dependencies {
        implementation project(':common')
    }
}

project(':lugar-votacion') {
    dependencies {
        implementation project(':common')
    }
}

project(':broker') {
    dependencies {
        implementation project(':common')
    }
}