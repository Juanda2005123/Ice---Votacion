//
// Install the gradle Ice Builder plug-in from the plug-in portal
//
plugins {
    id 'com.zeroc.gradle.ice-builder.slice' version '1.4.7' apply false
}
  
subprojects {
    //
    // Apply Java and Ice Builder plug-ins to all sub-projects
    //
    apply plugin: 'java'
    apply plugin: 'eclipse'  // ← Genera archivos .project y .classpath
    apply plugin: 'com.zeroc.gradle.ice-builder.slice'
 
    //
    // Both Client and Server projects share the Printer.ice Slice definitions
    //
    
    slice {
        java {
            files = [file("../common/src/main/slice/VotingService.ice")]  
        }
    }
    
        // Use Ice JAR files from maven central repository
    repositories {
        mavenCentral()
    }
      //
    // Both Client and Server depend only on Ice JAR
    //
    dependencies {
        implementation 'com.zeroc:ice:3.7.10'
        implementation 'com.zeroc:icestorm:3.7.10'
        implementation 'com.google.code.gson:gson:2.10.1'
        implementation 'org.postgresql:postgresql:42.6.0'
    }
      // Configuración Fat-JAR para proyectos ejecutables (no para common)
    if (project.name != 'common') {
        task fatJar(type: Jar) {
            archiveClassifier = 'fat'
            
            // Copiar el manifest del jar normal al fatJar
            manifest {
                from jar.manifest
            }
            
            from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
            with jar
            
            // Excluir archivos problemáticos de firmas
            exclude 'META-INF/*.SF'
            exclude 'META-INF/*.DSA'
            exclude 'META-INF/*.RSA'
            exclude 'META-INF/LICENSE*'
            exclude 'META-INF/NOTICE*'
            
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
        
        // Hacer que fatJar se ejecute con build
        build.dependsOn fatJar
    }
}

// Configure project-specific dependencies OUTSIDE of subprojects block
project(':mesa-votacion') {
    dependencies {
        implementation project(':common')
    }
}

project(':servidor-central') {
    dependencies {
        implementation project(':common')
    }
}

project(':departamento') {
    dependencies {
        implementation project(':common')
    }
}

project(':lugar-votacion') {
    dependencies {
        implementation project(':common')
    }
}

project(':broker') {
    dependencies {
        implementation project(':common')
    }
}

project(':proxy') {
    dependencies {
        implementation project(':common')
    }
}