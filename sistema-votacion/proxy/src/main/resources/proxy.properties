# Configuracion del Proxy de Validacion
# =====================================

# Identificacion del proxy
nodo.id=PROXY-001
nodo.nombre=Proxy Validacion Central

# Configuracion del servidor proxy
proxy.host=localhost
proxy.puerto=8001
proxy.timeout=5000

# Configuracion del nodo destino (donde se reenvian las validaciones)
nodo.destino.host=localhost
nodo.destino.puerto=9001
nodo.destino.timeout=5000

# Configuracion de conectividad
conexion.reintentos=3
conexion.timeout=3000