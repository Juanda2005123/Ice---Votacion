# ========================================
# CONFIGURACIÓN DEL BROKER DE VOTACIÓN
# ========================================

# Identificación del broker
nodo.id=BROKER-CONSULTAS
nodo.nombre=broker-consultas

# Configuración del servidor Ice
broker.puerto=9000
broker.host=localhost
broker.timeout=5000

# Configuración de destinos (puede ser lugar-votacion, departamento, servidor-central)
destinos.cantidad=2

# Lugar de votación 1
destino.1.id=consulta-A
destino.1.host=localhost
destino.1.puerto=8001
destino.1.activo=true
destino.1.tipo=consulta

# Lugar de votación 2  
destino.2.id=consulta-B
destino.2.host=localhost
destino.2.puerto=8002
destino.2.activo=true
destino.2.tipo=consulta


# Estrategia de enrutamiento
enrutamiento.estrategia=ALEATORIO
enrutamiento.timeout=3000

# Configuración de logging
logging.nivel=INFO
logging.archivo=broker.log

