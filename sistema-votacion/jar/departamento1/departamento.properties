# ========================================
# CONFIGURACIÓN DEL DEPARTAMENTO DE VOTACIÓN
# ========================================

# Identificación del departamento
nodo.id=DEPARTAMENTO-001
nodo.nombre=Departamento Central

# Configuración del servidor Ice (para recibir del broker lugar-departamento)
departamento.host=localhost
departamento.puerto=7001
departamento.timeout=5000

# Configuración del servidor central (conexión directa - sin broker)
servidor.central.host=localhost
servidor.central.puerto=6000
servidor.central.timeout=5000

# Configuración de deltas
delta.umbral.votos=2000        
# Enviar cada 2000 votos consolidados
delta.umbral.tiempo=3000       
# O cada 3 segundos (en ms)

# Thread Pool para Map-Reduce
threads.pool.size=8            
# Hilos para MAP phase

# Configuración de conexión
conexion.reintentos=3
conexion.timeout=3000

# Configuración de logging
logging.nivel=INFO
logging.archivo=departamento.log