# ========================================
# CONFIGURACIÓN DEL SERVIDOR CENTRAL DE VOTACIÓN
# ========================================

# Identificación del servidor central
nodo.id=SERVIDOR-CENTRAL-001
nodo.nombre=Servidor Central de Votacion

# Configuración del servidor Ice (para recibir de departamentos)
servidor.host=localhost
servidor.puerto=6000
servidor.timeout=5000

# Thread Pool para Reduce Final
threads.pool.size=8            
# Hilos para procesamiento concurrente de deltas

# Configuración de conexión
conexion.reintentos=3
conexion.timeout=3000

# Configuración de logging
logging.nivel=INFO
logging.archivo=servidor-central.log