# ========================================
# CONFIGURACIÓN DEL BROKER DE VOTACIÓN
# ========================================

# Identificación del broker
broker.id=BROKER-001
broker.nombre=Broker Mesa a Lugar

# Configuración del servidor Ice
broker.puerto=9000
broker.host=localhost
broker.timeout=5000

# Configuración de deltas (para reenvío)
delta.umbral.votos=50          
# Buffer antes de reenvío
delta.umbral.tiempo=100        
# O cada 100ms

# Thread Pool para reenvío
threads.pool.size=10           
# Hilos para reenvío paralelo

# Configuración de destinos
destinos.cantidad=2

# Lugar de votación 1
destino.1.id=LUGAR-001
destino.1.host=localhost
destino.1.puerto=8001
destino.1.activo=true

# Lugar de votación 2  
destino.2.id=LUGAR-002
destino.2.host=localhost
destino.2.puerto=8002
destino.2.activo=true

# Estrategia de enrutamiento
enrutamiento.estrategia=ALEATORIO
enrutamiento.reintentos=3
enrutamiento.timeout=3000

# Configuración del Proxy de Validación
proxy.host=localhost
proxy.puerto=8001
proxy.timeout=5000

# Configuración de logging
logging.nivel=INFO
logging.archivo=broker.log