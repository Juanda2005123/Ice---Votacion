# ========================================
# CONFIGURACIÓN DEL BROKER LUGAR-VOTACION A DEPARTAMENTO
# ========================================

# Identificación del broker
nodo.id=BROKER-002
nodo.nombre=Broker Lugar a Departamento

# Configuración del servidor Ice
broker.puerto=9001
broker.host=localhost
broker.timeout=5000

# Configuración de destinos (departamentos)
destinos.cantidad=2

# Departamento 1
destino.1.id=DEPARTAMENTO-001
destino.1.host=localhost
destino.1.puerto=7001
destino.1.activo=true
destino.1.tipo=departamento

# Departamento 2
destino.2.id=DEPARTAMENTO-002
destino.2.host=localhost
destino.2.puerto=7002
destino.2.activo=true
destino.2.tipo=departamento

# Estrategia de enrutamiento
enrutamiento.estrategia=ALEATORIO
enrutamiento.timeout=3000

# Configuración del Proxy de Validación
proxy.host=localhost
proxy.puerto=11001
proxy.timeout=5000

# Configuración de logging
logging.nivel=INFO
logging.archivo=broker-departamento.log